name: Android APK

on:
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: "Also boot an Android emulator and run instrumented (install + launch) tests"
        type: boolean
        default: true
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["backend/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["backend/**", "docs/**", "**.md"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (validates wrapper, caches safely)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes to the cache; other branches read it. This keeps
          # untrusted branches from poisoning the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Artifact metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=SwarAIStudio-debug-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-test-log.txt

      - name: Lint
        run: ./gradlew --no-daemon lintDebug 2>&1 | tee lint-log.txt

      - name: Build debug APK (+ instrumented test APK)
        env:
          SWARAI_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest 2>&1 | tee build-log.txt

      - name: Verify APK exists
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not produced"; exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/${{ steps.meta.outputs.artifact_name }}.apk"
          ls -la dist
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            unit-test-log.txt
            lint-log.txt
            build-log.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "## SwarAI Studio debug build"
            echo ""
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK artifact: **${{ steps.meta.outputs.artifact_name }}**"
            echo ""
            echo "Download on your phone: open this run page, scroll to **Artifacts**, tap the artifact name."
            echo "GitHub delivers it as a .zip; open the zip in your Files app and tap the .apk inside."
            if [ -f dist/SHA256SUMS.txt ]; then echo ""; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  emulator:
    name: Install + launch on Android emulator
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.run_emulator_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run instrumented tests on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee instrumented-log.txt

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            instrumented-log.txt
          if-no-files-found: ignore
          retention-days: 14
