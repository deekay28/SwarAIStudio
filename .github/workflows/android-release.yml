name: Android signed release APK

# Manual only. Requires these repository secrets (Settings → Secrets and variables → Actions):
#   SWARAI_KEYSTORE_BASE64   base64 of your release .jks/.keystore file
#   SWARAI_KEYSTORE_PASSWORD
#   SWARAI_KEY_ALIAS
#   SWARAI_KEY_PASSWORD
# See docs/RELEASE_SIGNING.md. Nothing secret is stored in the repository.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 0.1.0"
        required: true
        default: "0.1.0"
      create_draft_release:
        description: "Also create a DRAFT GitHub Release with the APK attached (you publish it manually)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # only used by the optional draft-release step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the runner's preinstalled Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check signing secrets are configured
        env:
          KS: ${{ secrets.SWARAI_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.SWARAI_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.SWARAI_KEY_ALIAS }}
          KP: ${{ secrets.SWARAI_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing SWARAI_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing SWARAI_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing SWARAI_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing SWARAI_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/RELEASE_SIGNING.md)"; exit 1; fi

      - name: Decode keystore to a temp file
        env:
          KS: ${{ secrets.SWARAI_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SWARAI_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SWARAI_KEYSTORE_PASSWORD: ${{ secrets.SWARAI_KEYSTORE_PASSWORD }}
          SWARAI_KEY_ALIAS: ${{ secrets.SWARAI_KEY_ALIAS }}
          SWARAI_KEY_PASSWORD: ${{ secrets.SWARAI_KEY_PASSWORD }}
          SWARAI_VERSION_NAME: ${{ inputs.version_name }}
          SWARAI_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee release-build-log.txt

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Release APK missing (was it left unsigned?)"; ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist && cp "$APK" "dist/SwarAIStudio-${{ inputs.version_name }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: SwarAIStudio-release-${{ inputs.version_name }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: release-build-log.txt

      - name: Create DRAFT GitHub Release (optional)
        if: inputs.create_draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: SwarAI Studio ${{ inputs.version_name }}
          draft: true
          files: |
            dist/SwarAIStudio-${{ inputs.version_name }}.apk
            dist/SHA256SUMS.txt
